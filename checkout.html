<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frizzle Pro</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    main.checkout { max-width: 560px; margin: 0 auto; padding: 72px 16px; }
    main.checkout h1 { margin: 0 0 12px; }
    main.checkout .done { display: none; }
    main.checkout.is-done .done { display: block; }
    main.checkout.is-done .waiting { display: none; }
  </style>
  <!-- Paddle Billing. This page is the account's "default payment link": Frizzle's
       server creates a transaction and sends the student here with ?_ptxn=…, and
       Paddle.js opens the checkout for it. -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>
<main class="checkout" id="checkout">
  <h1>Frizzle Pro</h1>
  <div class="waiting">
    <p>The checkout opens on this page. Paddle, our reseller, takes the payment and handles tax and receipts.</p>
    <p>Nothing opening? Go back to Frizzle and choose Get Frizzle Pro again.</p>
  </div>
  <div class="done">
    <p>You're all set. Go back to Frizzle; Pro switches on there in a few seconds.</p>
  </div>
</main>
<script>
  // Set these from the Paddle dashboard: Developer tools → Authentication → client-side token.
  const paddleEnvironment = "sandbox"; // "production" when selling
  const paddleClientToken = "test_replace_with_client_side_token";

  if (paddleEnvironment === "sandbox") Paddle.Environment.set("sandbox");
  Paddle.Initialize({
    token: paddleClientToken,
    eventCallback(event) {
      if (event.name === "checkout.completed") document.getElementById("checkout").classList.add("is-done");
    },
  });
</script>
</body>
</html>
